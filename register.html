<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThinkTrack Journal - Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <!-- Floating Background Shapes -->
    <div class="floating-shape shape-one"></div>
    <div class="floating-shape shape-two"></div>
    <div class="floating-shape shape-three"></div>

    <main class="login-wrapper">

        <section class="login-card">

            <!-- Logo -->
            <div class="brand-icon">🧠</div>

            <h1>Create Your Account</h1>

            <p class="tagline">
                Start your personal ThinkTrack journey.
            </p>

            <!-- Register Form -->
            <form id="registerForm">

                <!-- Name -->
                <label for="user_name">Your user_name</label>

                <input
                    type="text"
                    id="user_name"
                    placeholder="Enter your name"
                    required
                >

                <!-- Email -->
                <label for="registerEmail">Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

                <!-- Password -->
                <label for="registerPassword">Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                    minlength="6"
                >

                <!-- Confirm Password -->
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                    minlength="6"
                >

                <!-- Register Button -->
                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Account ✨
                </button>

                <!-- Message -->
                <p id="registerMessage"></p>

            </form>

            <!-- Login Link -->
            <p class="register-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <!-- Note -->
            <p class="login-note">
                Your private space for daily thoughts and emotions.
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
