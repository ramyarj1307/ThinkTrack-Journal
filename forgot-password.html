<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkTrack Journal - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="floating-shape shape-one"></div>
    <div class="floating-shape shape-two"></div>
    <div class="floating-shape shape-three"></div>

    <main class="login-wrapper">
        <section class="login-card">

            <div class="brand-icon">🔐</div>

            <h1>Forgot Password?</h1>

            <p class="tagline">
                Don't worry, we'll help you get back into your account.
            </p>

            <form id="forgotPasswordForm">

                <label for="forgotEmail">Email</label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="Enter your registered email"
                    required
                >

                <button type="submit" class="primary-button">
                    Continue ✨
                </button>

                <p id="forgotMessage"></p>

            </form>

            <p class="register-text">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </p>

            <p class="login-note">
                We'll help you securely reset your password.
            </p>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
